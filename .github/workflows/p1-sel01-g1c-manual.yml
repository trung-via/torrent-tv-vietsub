# PROPOSED: source-pin SEL-01 manual-only build. Do not merge without Human review/approval.
# Exact reviewed app source SHA, dedicated Torrent TV runner, private 7-day artifact.
# No push/pull_request/schedule/workflow_run trigger, no ADB/TV/AIOS steps.
name: Torrent TV - P1 SEL-01 G1c Manual Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1c:
    name: Build SEL-01 G1c external SRT probe on dedicated Windows runner
    if: github.repository == 'trung-via/torrent-tv-vietsub'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout exact reviewed SEL-01 G1c source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: 4ead266bc303e44efd83bd5e4270d3919951cf6a
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable SEL-01 G1c source and run isolated build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = '4ead266bc303e44efd83bd5e4270d3919951cf6a'
          $actual = (git -C "$env:GITHUB_WORKSPACE" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $pin) {
            throw 'STOP: SEL-01 G1c source SHA mismatch'
          }
          .\poc\g1c\build-on-runner.ps1 -AppRepoRoot "$env:GITHUB_WORKSPACE"

      - name: Upload SEL-01 G1c debug APK and sanitized evidence privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: p1-sel01-g1c-debug-apk
          path: |
            ${{ runner.temp }}/p1-g1c-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/p1-g1c-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            ${{ runner.temp }}/p1-g1c-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/P1-G1C-BUILD-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 7
