name: Torrent TV - Owner Selected File Resolver Offline CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p2-sub-discovery/owner_selected_file_resolver.py'
      - 'poc/p2-sub-discovery/test_owner_selected_file_resolver.py'
      - 'docs/subtitle-activation/OWNER_SELECTED_FILE_RESOLVER.md'
      - '.github/workflows/tv-owner-selected-file-resolver-ci.yml'

permissions:
  contents: read

jobs:
  selected-file-source:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-owner-selected-file-resolver-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-local-english-direct-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify fake TV-TorrServer selected-file and owner-local binding only
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/poc/p2-sub-discovery:$PWD/poc/p2-aisub"
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_owner_selected_file_resolver.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_*.py' -v
          python3 -m py_compile poc/p2-sub-discovery/owner_selected_file_resolver.py
          echo 'P3_RESOLVER_SYNTHETIC_ONLY_NO_REAL_MEDIA_NO_NETWORK_NO_TV_NO_API'
