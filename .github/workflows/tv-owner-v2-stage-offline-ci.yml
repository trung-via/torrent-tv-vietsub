name: Torrent TV Owner V2 inert stage - offline CI

on:
  pull_request:
    paths:
      - hostops/setup/stage-owner-p3p4-v2.ps1
      - poc/p2-sub-discovery/test_owner_v2_stage_contract.py
      - docs/integration/P3P4_OWNER_V2_SAFE_STAGE.md
      - .github/workflows/tv-owner-v2-stage-offline-ci.yml

permissions:
  contents: read

jobs:
  owner-v2-stage-source-only:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Parse PowerShell source without executing owner-side code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $path = Join-Path $env:GITHUB_WORKSPACE 'hostops\setup\stage-owner-p3p4-v2.ps1'
          [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'OWNER_V2_STAGE_PARSE_FAILED' }
          Write-Host 'OWNER_V2_STAGE_WINDOWS_PARSE=PASS'
      - name: Verify exact source-hash and nonmutation contract
        shell: pwsh
        run: |
          python -m unittest discover -s poc/p2-sub-discovery -p test_owner_v2_stage_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw 'OWNER_V2_STAGE_CONTRACT_FAILED' }
          Write-Host 'OWNER_V2_STAGE_OFFLINE_CONTRACT=PASS'
