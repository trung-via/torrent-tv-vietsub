# P3 P4 source-only Android Debug build. No adb/install/artifact/release.
name: Torrent TV - P3 P4 Composed Android Debug CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p4-auto-sub/**'
      - '.github/workflows/tv-p3-native-android-compose-ci.yml'

permissions:
  contents: read

concurrency:
  group: torrent-tv-p3-composed-pr151
  cancel-in-progress: true

jobs:
  p3-p4-gradle:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.number == 151 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-omp-native-selection-sender-20261114' &&
      github.event.pull_request.base.ref == 'feature/p4-expired-session-diagnosis-20261114'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout exact owner-controlled P3 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compose exact pinned OMP G1 G2 P4 P3 and compile Android Debug
        shell: powershell
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\p4-auto-sub\build-p3-composed-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit $env:PR_HEAD
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            throw 'STOP: P3 composed Android Debug build/unit tests failed'
          }

      - name: Record no-device/no-publish boundary
        if: success()
        shell: powershell
        run: |
          Write-Host 'P3_P4_ANDROID_GRADLE_BUILD_PASS_ONLY_NO_ADB_NO_TV_INSTALL_NO_APK_UPLOAD_NO_RELEASE'
