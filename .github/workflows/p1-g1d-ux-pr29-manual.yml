# Manual-only build gate for Human-approved PR #29 G1d UX.
# Does NOT trigger on push, pull_request, schedule, or workflow_run.
# Prepared as a Draft; manually dispatchable only after separate Human
# approval to put this workflow file onto the repository default branch.
name: Torrent TV - G1d UX PR29 Manual Debug Build

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter BUILD_PR29_ONCE to acknowledge this single authorized build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  g1d-ux:
    name: Pinned PR29 debug on dedicated Torrent TV runner
    if: github.repository == 'trung-via/torrent-tv-vietsub' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout immutable reviewed PR29 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: dc62b0aaebea2d6abf55e98a0e9b6d6171e36a92
          persist-credentials: false
          fetch-depth: 1

      - name: Guard manual consent, source commit and dedicated runner
        shell: powershell
        env:
          BUILD_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedSource = 'dc62b0aaebea2d6abf55e98a0e9b6d6171e36a92'
          if ($env:BUILD_CONFIRMATION -cne 'BUILD_PR29_ONCE') {
            throw 'STOP: explicit single-build confirmation absent'
          }
          if ($env:GITHUB_REPOSITORY -cne 'trung-via/torrent-tv-vietsub' -or
              $env:RUNNER_NAME -cne 'torrent-tv-vietsub-win' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') {
            throw 'STOP: incorrect repository, runner or event'
          }
          if (-not $env:RUNNER_WORKSPACE -or -not $env:RUNNER_TEMP -or
              -not $env:GITHUB_RUN_ID -or -not $env:GITHUB_RUN_ATTEMPT) {
            throw 'STOP: missing isolated runner environment'
          }
          $allowed = [IO.Path]::GetFullPath('C:\TOOL\TorrentTV-Runner\_work').TrimEnd('\') + '\'
          foreach ($dir in @($env:RUNNER_WORKSPACE,$env:RUNNER_TEMP)) {
            $resolved = [IO.Path]::GetFullPath($dir).TrimEnd('\') + '\'
            if (-not $resolved.StartsWith($allowed,[StringComparison]::OrdinalIgnoreCase)) {
              throw 'STOP: not inside dedicated application runner workspace'
            }
          }
          $actual = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expectedSource) {
            throw 'STOP: source does not match Human-reviewed PR29 commit'
          }
          $dirty = @(& git -C $env:GITHUB_WORKSPACE status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw 'STOP: expected clean PR29 checkout'
          }
          foreach ($file in @(
            'poc\g1c\P1G1CSubtitleRegistry.debug.kt',
            'poc\g1c\P1G1CSubtitleRegistry.release.kt',
            'poc\g1c\apply.ps1',
            'poc\g1c\verify.ps1',
            'poc\g1c\build-on-runner.ps1'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $file) -PathType Leaf)) {
              throw 'STOP: missing pinned G1d UX build input'
            }
          }
          Write-Host 'G1D_UX_PR29_COMMIT_AND_RUNNER_PREFLIGHT_PASS'

      - name: Apply G1d UX patch in isolated pinned OMP and build debug APK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\g1c\build-on-runner.ps1') -AppRepoRoot $env:GITHUB_WORKSPACE
          if (-not $?) { throw 'STOP: PR29 gated build script reported failure' }

      - name: Upload debug APK, SHA256SUMS and sanitized evidence privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-g1d-ux-pr29-debug-apk
          path: |
            ${{ runner.temp }}/p1-g1c-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/p1-g1c-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            ${{ runner.temp }}/p1-g1c-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/P1-G1C-BUILD-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 7
