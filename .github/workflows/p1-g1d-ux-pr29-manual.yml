# Manual G1 Production build on Draft branch only; same path on main is PR29.
# No push, PR, schedule, workflow_run, merge, Release, install or ADB.
name: Torrent TV - G1 Production Manual Debug Build

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BUILD_G1_PROD_DEBUG_ONCE (no TV install, no Release)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  g1-prod:
    name: G1 Production source guard plus Debug/unit tests (dedicated runner)
    if: github.event.repository.private == true && github.repository == 'trung-via/torrent-tv-vietsub' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/g1-production-sidecar-picker-20261027' && inputs.confirmation == 'BUILD_G1_PROD_DEBUG_ONCE'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout immutable reviewed G1 Production build source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: aa9a85707db1aa26f8ce86c4a5086b8e977c8be2
          persist-credentials: false
          fetch-depth: 1

      - name: Execute single approved isolated Debug build and tests
        shell: powershell
        env:
          BUILD_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_CONFIRMATION -cne 'BUILD_G1_PROD_DEBUG_ONCE' -or
              $env:GITHUB_REF -cne 'refs/heads/feature/g1-production-sidecar-picker-20261027' -or
              $env:GITHUB_WORKFLOW_REF -cne 'trung-via/torrent-tv-vietsub/.github/workflows/p1-g1d-ux-pr29-manual.yml@refs/heads/feature/g1-production-sidecar-picker-20261027') {
            throw 'STOP: wrong G1 Production manual input, branch or workflow'
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\g1-prod\build-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit 'aa9a85707db1aa26f8ce86c4a5086b8e977c8be2'
          if (-not $?) { throw 'STOP: G1 Production build did not pass' }

      - name: Upload Debug APK SHA256 and build proof (private repo only, 7 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: g1-production-debug-apk
          path: |
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/SHA256SUMS-G1PROD.txt
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/G1PROD-BUILD-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 7
