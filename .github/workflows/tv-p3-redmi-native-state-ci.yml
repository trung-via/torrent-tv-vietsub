name: Torrent TV - P3 Redmi Native Signed State CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p4-auto-sub/**'
      - 'docs/subtitle-activation/P3_REDMi_NATIVE_STATUS.md'
      - '.github/workflows/tv-p3-redmi-native-state-ci.yml'
permissions:
  contents: read
concurrency:
  group: torrent-tv-p3-state-pr155
  cancel-in-progress: true
jobs:
  native-source:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.number == 155 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-redmi-native-current-state-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-omp-native-selection-sender-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact HEAD without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Native PlayerActivity current status patch + P4 source regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s poc/p4-auto-sub -p 'test_p3_tv_*.py' -v
          python3 -m unittest discover -s poc/p4-auto-sub -p 'test_session_loss_contract.py' -v
          python3 -m py_compile poc/p4-auto-sub/p3_activity_patch.py
          echo 'P3_REDMi_STATUS_SOURCE_ONLY_NO_APK_NO_TV_NO_API'
  composed-android:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.number == 155 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-redmi-native-current-state-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-omp-native-selection-sender-20261114'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    needs: native-source
    steps:
      - name: Checkout exact candidate with no stored token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned G1 G2 P4 and native P3 status, compile/debug Android
        shell: powershell
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\p4-auto-sub\build-p3-redmi-state-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit $env:PR_HEAD
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            throw 'STOP: P3 Redmi current-state Android Debug build failed'
          }
      - name: No APK release, install, ADB or owner PC changes
        if: success()
        shell: powershell
        run: |
          Write-Host 'P3_REDMi_CURRENT_STATE_ANDROID_COMPOSED_PASS_NOT_REAL_TV_OR_LAN_PASS'
