name: Torrent TV - P3 Explicit Viewer Request Android CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p4-auto-sub/**'
      - 'docs/subtitle-activation/P3_VIEWER_REQUEST_TV.md'
      - '.github/workflows/tv-p3-explicit-viewer-tv-ci.yml'
permissions:
  contents: read
concurrency:
  group: torrent-tv-p3-viewer-pr159
  cancel-in-progress: true
jobs:
  explicit-viewer-source:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.number == 159 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-explicit-viewer-request-tv-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-redmi-native-current-state-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact user-owned PR HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Source-only exact consent UI overlay and P4 session regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s poc/p4-auto-sub -p 'test_p3_tv_*.py' -v
          python3 -m unittest discover -s poc/p4-auto-sub -p 'test_session_loss_contract.py' -v
          python3 -m py_compile poc/p4-auto-sub/p3_activity_patch.py
          echo 'P3_VIEWER_UI_SOURCE_ONLY_NO_REAL_APK_OR_PROVIDER'
  android-debug:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.number == 159 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-explicit-viewer-request-tv-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-redmi-native-current-state-20261114'
    needs: explicit-viewer-source
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout exact owner P3 viewer branch HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile disposable pinned OMP G1 G2 P4 and P3 request UI
        shell: powershell
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\p4-auto-sub\build-p3-explicit-viewer-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit $env:PR_HEAD
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            throw 'STOP: explicit viewer activation Android Gradle build failed'
          }
      - name: Gate release and device side effects
        if: success()
        shell: powershell
        run: |
          Write-Host 'P3_VIEWER_CONSENT_ANDROID_GRADLE_PASS_ONLY_NO_ADB_NO_INSTALL_NO_APK_PUBLISH_NO_API'
