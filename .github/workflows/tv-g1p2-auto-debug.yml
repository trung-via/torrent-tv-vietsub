# G1+P2 automated Debug BUILD only after merged Owner Brain PASS + verified PR CI.
# PUBLIC repo: never upload raw APK automatically; never install/ADB/Release.
name: Torrent TV - G1 P2 Auto Debug After Brain PASS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tv-g1p2-auto-debug.yml'
      - '.github/workflows/tv-g1p2-auto-policy-ci.yml'
      - 'poc/g1-p2-auto/**'
      - 'poc/g1-prod/**'
      - 'poc/p2-source/omp-ui/**'

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

concurrency:
  group: torrent-tv-g1p2-auto-debug-main
  cancel-in-progress: false

jobs:
  brain-acceptance:
    name: Prove exact Owner Brain PASS and PR CI before self-host build
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      pr: ${{ steps.gate.outputs.pr }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - name: Checkout exact merged main commit for hosted-only gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify canonical Owner PASS, merged PR, main SHA, and all PR code checks
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 poc/g1-p2-auto/verify_merged_pass.py

  composed-debug:
    name: Auto build G1+P2 Debug on dedicated Torrent TV Windows runner
    needs: brain-acceptance
    if: >-
      needs.brain-acceptance.result == 'success' &&
      needs.brain-acceptance.outputs.approved == 'true' &&
      needs.brain-acceptance.outputs.source_sha == github.sha
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout accepted immutable main merge commit; never PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Apply G1 and P2, run tests, assemble Debug, record SHA256
        shell: powershell
        env:
          AUTO_SOURCE_SHA: ${{ needs.brain-acceptance.outputs.source_sha }}
          G1P2_AUTO_SOURCE_SHA: ${{ needs.brain-acceptance.outputs.source_sha }}
          G1P2_AUTO_BRAIN_APPROVED: ${{ needs.brain-acceptance.outputs.approved }}
          G1P2_AUTO_BRAIN_PR: ${{ needs.brain-acceptance.outputs.pr }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_SHA -cne $env:AUTO_SOURCE_SHA -or
              $env:G1P2_AUTO_BRAIN_APPROVED -cne 'true') {
            throw 'STOP: unapproved or mismatched automatic Debug build'
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\p2-source\omp-ui\build-g1p2-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit $env:AUTO_SOURCE_SHA
          if (-not $?) { throw 'STOP: combined G1+P2 Debug build failed' }

      - name: Persist verified ARM32 Debug APK to Windows private vault before temp cleanup
        shell: powershell
        env:
          G1P2_AUTO_SOURCE_SHA: ${{ needs.brain-acceptance.outputs.source_sha }}
          G1P2_AUTO_BRAIN_APPROVED: ${{ needs.brain-acceptance.outputs.approved }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\g1-p2-auto\retain-private-arm32.ps1') `
            -SourceCommit $env:GITHUB_SHA
          if (-not $?) { throw 'STOP: local private APK retention failed' }

      - name: Upload SHA256 and redacted build manifest only; NEVER PUBLIC APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: g1p2-auto-debug-evidence-only
          path: |
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/SHA256SUMS-G1P2.txt
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/G1P2-BUILD-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 3
