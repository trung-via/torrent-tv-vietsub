name: Torrent TV - P3 P4 Verified Ready Owner CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p2-sub-discovery/**'
      - 'poc/p2-aisub/**'
      - 'docs/subtitle-activation/P3_P4_VERIFIED_READY.md'
      - '.github/workflows/tv-p3-p4-verified-ready-ci.yml'
permissions:
  contents: read
jobs:
  verified-source:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-p4-verified-ready-source-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-explicit-viewer-request-owner-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact owner source candidate HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Same-owner D1-D2-P2-V3-P4 source-ready and legacy P4 regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/poc/p3-vietsub-trigger:$PWD/poc/p2-sub-discovery:$PWD/poc/p2-aisub"
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_p4_verified_ready.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_p4_source_ready.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_owner_state_wiring.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_signed_signal_to_owner.py' -v
          python3 -m unittest discover -s poc/p2-aisub -p 'test_*.py' -q
          python3 -m py_compile poc/p2-sub-discovery/{p3_p4_ready_registry.py,verified_v3_processor.py,p3_owner_state_wiring.py}
          python3 -m py_compile poc/p2-aisub/{verified_vietsub_ready.py,paired_activation.py}
          echo 'P3_P4_VERIFIED_READY_SOURCE_ONLY_NO_PROVIDER_NO_OWNER_NETWORK_NO_REAL_TV'
