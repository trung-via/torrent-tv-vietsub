# Torrent TV G1+P2: main-only, one-shot attended Debug APK build.
# Repository is PUBLIC: artifacts can be accessible to others. Do not dispatch
# without an explicit PUBLIC_ARTIFACT confirmation from the owner.
# No PR/push/schedule trigger, ADB, TV installation, Windows service or Release.
name: Torrent TV - G1 P2 Combined Manual Debug Build

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BUILD_G1P2_DEBUG_PUBLIC_ARTIFACT_ONCE (PUBLIC debug artifact, no TV install)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: torrent-tv-g1p2-manual-debug
  cancel-in-progress: false

jobs:
  g1p2-debug:
    name: Pinned G1+P2 Debug APK and Android/P2 tests (dedicated Windows)
    if: github.repository == 'trung-via/torrent-tv-vietsub' && github.actor == 'trung-via' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'BUILD_G1P2_DEBUG_PUBLIC_ARTIFACT_ONCE'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout immutable source with G1 subtitle and P2 UI overlays
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # SHA pinned v4
        with:
          ref: 93c0cc400c935285a21fb06a881fd3094a636170
          persist-credentials: false
          fetch-depth: 1

      - name: Compose reviewed overlays and build one Debug APK (no device effects)
        shell: powershell
        env:
          G1P2_BUILD_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:G1P2_BUILD_CONFIRMATION -cne 'BUILD_G1P2_DEBUG_PUBLIC_ARTIFACT_ONCE' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_WORKFLOW_REF -cne 'trung-via/torrent-tv-vietsub/.github/workflows/p2-g1-combined-manual.yml@refs/heads/main' -or
              $env:GITHUB_ACTOR -cne 'trung-via') {
            throw 'STOP: G1P2 public-artifact Human confirmation/branch/identity mismatch'
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\p2-source\omp-ui\build-g1p2-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit '93c0cc400c935285a21fb06a881fd3094a636170'
          if (-not $?) { throw 'STOP: combined Debug compile and tests failed' }

      - name: Upload publicly accessible Debug APK and SHA256 evidence (not release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # SHA pinned v4.6.2
        with:
          name: g1p2-combined-public-debug-apk
          path: |
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/SHA256SUMS-G1P2.txt
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/G1P2-BUILD-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 3
