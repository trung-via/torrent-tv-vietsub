# Human-reviewed, allowlisted ChatGPT -> GitHub Actions bridge.
# Install on the repository's DEFAULT branch (`main`) once.
# This workflow only validates a future Human-authorized comment and dispatches a pinned main build; it never executes APK code.
name: Torrent TV - ChatGPT G1 Debug Dispatch Bridge

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read # required to verify PR #38 head/state in a private repository

concurrency:
  group: torrent-tv-chatgpt-g1-dispatch
  cancel-in-progress: false

jobs:
  dispatch-reviewed-g1:
    if: >-
      ${{
        github.repository == 'trung-via/torrent-tv-vietsub' &&
        github.event.repository.private == true &&
        github.actor == 'trung-via' &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.issue.number == 38 &&
        github.event.issue.pull_request != null &&
        github.event.comment.body == '/tv-action g1-prod-debug-main 9a3d22967209761396c93d03df5ce71d4be06324'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PR merged, pinned main G1 source and no active duplicate build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='trung-via/torrent-tv-vietsub'
          branch='main'
          expected_merge='true'
          expected_source='9a3d22967209761396c93d03df5ce71d4be06324'

          merged="$(gh api "repos/$repo/pulls/38" --jq '.merged')"
          [[ "$merged" == "$expected_merge" ]] || {
            echo 'BLOCKED: PR #38 has not merged; G1 main dispatch is unavailable.'
            exit 1
          }

          # Verify that the main-only G1 Production workflow checks out the
          # immutable source. This is an informational double-check; its own
          # immutable checkout and event/branch/runner guards remain mandatory.
          contents="$(gh api "repos/$repo/contents/.github/workflows/p1-g1-production-manual.yml?ref=$branch" --jq '.content' | base64 --decode)"
          grep -Fq "ref: $expected_source" <<< "$contents" || {
            echo 'BLOCKED: target workflow source pin drift.'
            exit 1
          }
          active="$(gh run list --repo "$repo" --workflow p1-g1-production-manual.yml --branch "$branch" --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")] | length')"
          [[ "$active" == '0' ]] || {
            echo 'BLOCKED: another G1 Production build is queued or running.'
            exit 1
          }

          gh workflow run p1-g1-production-manual.yml \
            --repo "$repo" \
            --ref "$branch" \
            -f confirmation=BUILD_G1_PROD_DEBUG_ONCE
          echo 'DISPATCH_REQUESTED_G1_MAIN_DEBUG_PINNED_SOURCE'
