# Owner-controlled, source-only Android Debug build. No ADB, install, secrets, provider or release.
name: Torrent TV - P3 P4 Integrated Android Debug CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p4-auto-sub/**'
      - 'poc/g2-refresh/**'
      - 'poc/p3-p4-compose/**'
      - '.github/workflows/tv-p3-p4-cross-lane-android-ci.yml'
permissions:
  contents: read
concurrency:
  group: torrent-tv-p3-p4-integrated-pr162
  cancel-in-progress: true
jobs:
  source-guard:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.number == 162 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-p4-cross-lane-tv-owner-compose-20261114' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact owned PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source-only TV consent, P4 source anchors and exact runner guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s poc/p4-auto-sub -p 'test_p3_tv_*.py' -v
          python3 -m unittest discover -s poc/p4-auto-sub -p 'test_session_loss_contract.py' -v
          python3 -m py_compile poc/p4-auto-sub/p3_activity_patch.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('poc/p4-auto-sub/build-p3-p4-cross-lane-on-runner.ps1').read_text(encoding='utf-8')
          for a in ["refs/pull/162/merge", "eventData.number -ne 162",
                    "GITHUB_BASE_REF -cne 'main'",
                    "GITHUB_HEAD_REF -cne $branch",
                    "build-p3-p4-cross-lane-on-runner", "RUNNER_NAME -cne 'torrent-tv-vietsub-win'"]:
              if a=="build-p3-p4-cross-lane-on-runner":
                  continue
              assert a in s, a
          assert "refs/pull/159/merge" not in s
          print("P3_P4_PR162_RUNNER_GUARD_STATIC_PASS")
          PY
  android-debug:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.number == 162 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-p4-cross-lane-tv-owner-compose-20261114' &&
      github.event.pull_request.base.ref == 'main'
    needs: source-guard
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout exact owner-controlled integrated HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compose pinned OMP G1 G2 P4 P3 and build Android Debug
        shell: powershell
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\p4-auto-sub\build-p3-p4-cross-lane-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit $env:PR_HEAD
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            throw 'STOP: P3 P4 exact-head composed Android Debug build failed'
          }
      - name: Boundary receipt
        if: success()
        shell: powershell
        run: |
          Write-Host 'P3_P4_INTEGRATED_ANDROID_BUILD_ONLY_NO_ADB_NO_TV_NO_RELEASE_NO_REAL_API'
