name: Torrent TV - P3 Paired TV Signal Offline CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p2-sub-discovery/p3_signed_playback_signal.py'
      - 'poc/p2-sub-discovery/p3_signed_signal_to_owner.py'
      - 'poc/p2-sub-discovery/test_p3_signed_playback_signal.py'
      - 'poc/p2-sub-discovery/test_p3_signed_signal_to_owner.py'
      - 'docs/subtitle-activation/P3_SIGNED_SIGNAL.md'
      - '.github/workflows/tv-p3-signed-signal-ci.yml'

permissions:
  contents: read

jobs:
  p3-signed-source:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-signed-playback-ingress-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-v3-selected-media-identity-compose-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Checkout exact PR head, no stored token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: HMAC and current TV cross-gate tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/poc/p2-sub-discovery:$PWD/poc/p2-aisub:$PWD/poc/p3-vietsub-trigger"
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_signed*.py' -v
          python3 -m py_compile poc/p2-sub-discovery/p3_signed_playback_signal.py poc/p2-sub-discovery/p3_signed_signal_to_owner.py
          echo 'P3_SIGNED_SIGNAL_SOURCE_ONLY_NO_HTTPS_LISTENER_NO_OWNER_MEDIA_NO_PROVIDER_NO_TV'
