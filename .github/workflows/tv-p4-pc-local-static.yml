# Owner P2 PR #118 only; read-only static validation of local PC setup.
# This CI never executes the preparation script, opens a LAN port or generates secrets.
name: Torrent TV - P4 PC Local Setup Static Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p2-aisub/prepare_p4_owner_pc.ps1'
      - 'poc/p2-aisub/start_p4_mock_gateway_owner.ps1'
      - 'poc/p2-aisub/auto_pair_owner_redmi_adb.ps1'
      - '.github/workflows/tv-p4-pc-local-static.yml'

permissions:
  contents: read

jobs:
  static:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.number == 118 &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/p2-api-progressive-local-20261111' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 8
    steps:
      - name: Checkout owner P2 head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Parse owner-only setup script WITHOUT executing it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            (Join-Path $env:GITHUB_WORKSPACE 'poc\p2-aisub\prepare_p4_owner_pc.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'poc\p2-aisub\start_p4_mock_gateway_owner.ps1'),
            (Join-Path $env:GITHUB_WORKSPACE 'poc\p2-aisub\auto_pair_owner_redmi_adb.ps1')
          )
          foreach ($script in $scripts) {
          $t = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $script,[ref]$t,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            foreach ($e in $errors) {
              Write-Host ('P4_PC_STATIC_PARSER_ID=' + $e.ErrorId + ' LINE=' + $e.Extent.StartLineNumber)
            }
            throw 'P4_PC_STATIC_STOP_INVALID_POWERSHELL'
          }
          }
          $src = Get-Content -LiteralPath $scripts[0] -Raw
          foreach ($phrase in @(
            'P4_OWNER_SETUP_STOP_CI_NOT_ALLOWED',
            'P4_OWNER_SETUP_STOP_EXISTING_PAIRING_NO_ROTATION',
            'Set-Acl',
            'P4_OWNER_NO_LISTENER_NO_FIREWALL_NO_TV_CHANGE'
          )) {
            if (-not $src.Contains($phrase)) {throw 'P4_PC_STATIC_STOP_MISSING_SAFETY_ANCHOR'}
          }
          $launcher = Get-Content -LiteralPath $scripts[1] -Raw
          foreach ($phrase in @('P4_MOCK_GATEWAY_STOP_CI_NOT_ALLOWED',
            'P4_MOCK_GATEWAY_OWNER_FOREGROUND_ONLY',
            '--mock-revisions','--mock-single-paired-media','--start-lan')) {
            if (-not $launcher.Contains($phrase)) {throw 'P4_PC_STATIC_STOP_LAUNCHER_UNSAFE'}
          }
          $adbSource=Get-Content -LiteralPath $scripts[2] -Raw
          foreach ($required in @('P4_ADB_BOOTSTRAP_STOP_CI_FORBIDDEN',
              'P4_ADB_BOOTSTRAP_STOP_SINGLE_AUTHORIZED_REDMi_REQUIRED',
              'P4_ADB_BOOTSTRAP_STOP_DEBUG_RUN_AS_REQUIRED',
              '-RedirectStandardInput $pair')) {
            if (-not $adbSource.Contains($required)) {
              throw 'P4_PC_STATIC_STOP_ADB_BOOTSTRAP_GUARD_MISSING'
            }
          }
          if ($launcher.Contains('--media-key $MediaKey')) {
            throw 'P4_PC_STATIC_STOP_MANUAL_MEDIA_KEY_REGRESSION'
          }
          Write-Host 'P4_PC_STATIC_NO_MANUAL_TV_MEDIA_KEY_PASS=true'
          Write-Host 'P4_PC_STATIC_POWERSHELL_PARSE_PASS=true'
          Write-Host 'P4_PC_STATIC_CI_DOES_NOT_EXECUTE_LOCAL_SETUP=true'
