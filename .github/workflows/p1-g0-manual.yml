# HUMAN APPROVED 2026-10-25: manual-only G0 debug build on the dedicated app runner.
# Source is pinned; no push, PR, schedule or workflow_run trigger.
name: Torrent TV - P1 G0 Manual Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g0:
    name: Build G0 probe on dedicated Windows runner
    if: github.repository == 'trung-via/torrent-tv-vietsub'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout exact trusted G0 source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: 0eb1e20cbc8fc055f1cebe63882bfd67ffa3baeb
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source snapshot and run isolated G0 build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = '0eb1e20cbc8fc055f1cebe63882bfd67ffa3baeb'
          $actual = (git -C "$env:GITHUB_WORKSPACE" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $pin) {
            throw 'STOP: G0 application-source SHA mismatch'
          }
          .\poc\g0\build-on-runner.ps1 -AppRepoRoot "$env:GITHUB_WORKSPACE"

      - name: Upload G0 debug APK and sanitized build evidence privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: p1-g0-debug-apk
          path: |
            ${{ runner.temp }}/p1-g0-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/p1-g0-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            ${{ runner.temp }}/p1-g0-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/P1-G0-BUILD-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 7
