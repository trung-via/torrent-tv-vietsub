
# Single reusable GitHub PRIVATE inbox -> dedicated Windows runner -> Redmi SRT delivery.
# No subtitle or film bytes stored in this PUBLIC source repository.
name: Torrent TV - Private Subtitle Handoff
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: torrent-tv-private-subtitle-handoff
  cancel-in-progress: false
jobs:
  delivery:
    if: >-
      ${{
        github.repository == 'trung-via/torrent-tv-vietsub' &&
        github.actor == 'trung-via' &&
        github.event.comment.user.login == 'trung-via' &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.issue.number == 82 &&
        github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/tv-subtitle deliver ')
      }}
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout accepted main job code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch exact SRT from private GitHub inbox and ADB push
        shell: powershell
        env:
          TTV_PRIVATE_SUBTITLE_READ_TOKEN: ${{ secrets.TTV_SUBTITLE_INBOX_READ }}
          TTV_PRIVATE_SUBTITLE_COMMAND: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'hostops\jobs\private-subtitle-handoff.ps1') -Request $env:TTV_PRIVATE_SUBTITLE_COMMAND
          if (-not $?) { throw 'PRIVATE_SUBTITLE_HANDOFF_FAILED' }
  receipt:
    needs: [delivery]
    if: >-
      ${{ always() &&
        github.repository == 'trung-via/torrent-tv-vietsub' &&
        github.actor == 'trung-via' &&
        github.event.comment.user.login == 'trung-via' &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.issue.number == 82 &&
        github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/tv-subtitle deliver ')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: none
      issues: write
    steps:
      - name: Return run receipt to owner Issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMENT: ${{ github.event.comment.id }}
          RUN_ID: ${{ github.run_id }}
          DELIVERY_RESULT: ${{ needs.delivery.result }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMENT" =~ ^[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          case "$DELIVERY_RESULT" in success|failure|cancelled|skipped) ;; *) exit 1 ;; esac
          msg="$(printf 'TTV_PRIVATE_SUBTITLE_HANDOFF_V1\nSource comment: %s\nRun ID: %s\nWindows delivery job: %s\nActions: https://github.com/%s/actions/runs/%s\nTV subtitle rendering and seek remain separate tests.' "$SOURCE_COMMENT" "$RUN_ID" "$DELIVERY_RESULT" "$GITHUB_REPOSITORY" "$RUN_ID")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/82/comments" -f "body=$msg" >/dev/null
