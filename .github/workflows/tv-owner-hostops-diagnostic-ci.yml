# Offline checks only. No self-hosted runner, credentials, Owner profile or TV.
name: Torrent TV - R0 Owner HostOps Diagnostic Source

on:
  pull_request:
    paths:
      - 'poc/p2-sub-discovery/owner_p3_p4_runtime.py'
      - 'poc/p2-sub-discovery/owner_hostops_snapshot.py'
      - 'poc/p2-sub-discovery/test_owner_hostops_snapshot.py'
      - 'poc/p2-sub-discovery/test_owner_p2_snapshot_once.py'
      - 'hostops/jobs/owner-diagnostic-snapshot.ps1'
      - 'hostops/setup/enroll-owner-diagnostic-spool.ps1'
      - 'hostops/setup/owner-p2-snapshot-once.ps1'
      - '.github/workflows/tv-owner-hostops-diagnostic-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: '3.12'
      - name: Test bounded Owner/HostOps snapshot contracts
        shell: pwsh
        run: |
          python -m unittest discover -s poc/p2-sub-discovery -p 'test_owner_hostops_snapshot.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'OWNER_HOSTOPS_SNAPSHOT_PYTHON_FAIL' }
          python -m unittest discover -s poc/p2-sub-discovery -p 'test_owner_p3_p4_diagnostics.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'OWNER_HOSTOPS_LEGACY_DIAGNOSTIC_REGRESSION' }
          python -m unittest discover -s poc/p2-sub-discovery -p 'test_owner_p2_snapshot_once.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'OWNER_HOSTOPS_OWNER_ONESHOT_REGRESSION' }
      - name: Parse Owner enrollment and trusted HostOps read-only PowerShell
        shell: pwsh
        run: |
          foreach ($file in @(
            'hostops/setup/enroll-owner-diagnostic-spool.ps1',
            'hostops/setup/owner-p2-snapshot-once.ps1',
            'hostops/jobs/owner-diagnostic-snapshot.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw 'OWNER_HOSTOPS_POWERSHELL_PARSE_FAIL' }
          }
          Write-Output 'OWNER_HOSTOPS_SOURCE_ONLY_PASS_NO_OWNER_TV_PROVIDER'
