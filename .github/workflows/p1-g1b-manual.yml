# DRAFT ONLY: manual G1b debug build; requires Human approval before merge and trigger.
# Exact reviewed app source SHA, dedicated Torrent TV runner, private 7-day artifact.
# No push/pull_request/schedule/workflow_run trigger, no ADB/TV/AIOS steps.
name: Torrent TV - P1 G1b Manual Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g1b:
    name: Build G1b external SRT probe on dedicated Windows runner
    if: github.repository == 'trung-via/torrent-tv-vietsub'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout exact reviewed G1b source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: 6cd70af23d8943187b517ec74e59872638750555
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable G1b source and run isolated build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = '6cd70af23d8943187b517ec74e59872638750555'
          $actual = (git -C "$env:GITHUB_WORKSPACE" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $pin) {
            throw 'STOP: G1b source SHA mismatch'
          }
          .\poc\g1\build-on-runner.ps1 -AppRepoRoot "$env:GITHUB_WORKSPACE"

      - name: Upload G1b debug APK and sanitized evidence privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: p1-g1b-debug-apk
          path: |
            ${{ runner.temp }}/p1-g1-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/p1-g1-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            ${{ runner.temp }}/p1-g1-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/P1-G1B-BUILD-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 7
