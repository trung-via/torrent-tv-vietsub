# G1+P2 one-shot Debug build, manual Owner dispatch only. Independent Torrent TV runner.
# PUBLIC repo: publish checksums/evidence only; do not upload an unreviewed APK.
name: Torrent TV - G1 P2 Composed Manual Debug Build

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BUILD_G1_P2_DEBUG_ONCE (no APK install, no Release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: torrent-tv-g1-p2-composed
  cancel-in-progress: false

jobs:
  composed-debug:
    name: G1 P2 composed Android Debug unit build
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.repository_owner == 'trung-via' &&
      github.actor == 'trung-via' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'BUILD_G1_P2_DEBUG_ONCE'
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 90
    steps:
      - name: Checkout exact main workflow-dispatch commit (not PR head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build G1 and P2 together in isolated pinned OMP checkout
        shell: powershell
        env:
          BUILD_CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_CONFIRMATION -cne 'BUILD_G1_P2_DEBUG_ONCE' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_ACTOR -cne 'trung-via' -or
              $env:GITHUB_WORKFLOW_REF -cne 'trung-via/torrent-tv-vietsub/.github/workflows/p1-g1-p2-composed-manual.yml@refs/heads/main') {
            throw 'STOP: G1+P2 build authorization or provenance mismatch'
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\g1-p2-composed\build-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit $env:SOURCE_COMMIT
          if (-not $?) { throw 'STOP: composite build failed' }

      - name: Upload only SHA256 and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: g1-p2-debug-build-evidence
          path: |
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/SHA256SUMS-G1P2.txt
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/G1P2-BUILD-EVIDENCE.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK only when repository is PRIVATE
        if: github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: g1-p2-composed-debug-apk
          path: |
            ${{ runner.temp }}/p1-g1-prod-${{ github.run_id }}-${{ github.run_attempt }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 2
