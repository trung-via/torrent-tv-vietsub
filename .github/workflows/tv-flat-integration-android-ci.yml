# FLAT/main integration Android Debug verification. No PR-number pin and no device installation.
name: Torrent TV - FLAT Composed Android Debug CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p4-auto-sub/**'
      - 'poc/g1-prod/**'
      - 'poc/g2-refresh/**'
      - '.github/workflows/tv-flat-integration-android-ci.yml'
permissions:
  contents: read
concurrency:
  group: torrent-tv-flat-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-guard:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.base.ref == 'main' &&
      (startsWith(github.event.pull_request.head.ref, 'feature/r0-flat-') ||
       (github.event.pull_request.number == 178 &&
        github.event.pull_request.head.ref == 'fix/full-flow-p2-p4-telemetry-20261121') ||
       (github.event.pull_request.number == 179 &&
        github.event.pull_request.head.ref == 'fix/p2-dual-candidates-20261122'))
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact owned PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert source bridge and synthetic one-tap tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s poc/p4-auto-sub -p 'test_p3_tv_*.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'FLAT_P3_TV_SOURCE_TEST_FAIL' }
          python -m unittest discover -s poc/g1-prod -p 'test_helper_blob_pin.py' -q
          if ($LASTEXITCODE -ne 0) { throw 'FLAT_G1_SOURCE_PIN_FAIL' }
          $builder = Join-Path $env:GITHUB_WORKSPACE 'poc\p4-auto-sub\build-p3-p4-cross-lane-on-runner.ps1'
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile($builder,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'FLAT_P3_P4_BUILDER_PARSE_FAIL' }
          $source = Get-Content -LiteralPath $builder -Raw
          foreach ($required in @(
            'feature/r0-flat-',
            'tv-flat-integration-android-ci.yml',
            'P4_COMPOSED_ANDROID_DEBUG_BUILD_AND_UNIT_TEST_PASS',
            'P4_APPROVED_PR_DEBUG_ARM32_STAGED_PRIVATELY_EXACT_SHA_PASS_NOT_INSTALLED'
          )) {
            if (-not $source.Contains($required)) { throw "FLAT_BUILDER_CONTRACT_MISSING:$required" }
          }
          if ($source.Contains('adb install')) { throw 'FLAT_BUILDER_MUST_NOT_INSTALL' }
          Write-Host 'FLAT_ANDROID_SOURCE_GUARD_PASS_NOT_APK_OR_TV'

  android-debug:
    needs: source-guard
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.base.ref == 'main' &&
      (startsWith(github.event.pull_request.head.ref, 'feature/r0-flat-') ||
       (github.event.pull_request.number == 178 &&
        github.event.pull_request.head.ref == 'fix/full-flow-p2-p4-telemetry-20261121') ||
       (github.event.pull_request.number == 179 &&
        github.event.pull_request.head.ref == 'fix/p2-dual-candidates-20261122'))
    runs-on: [self-hosted, Windows, X64, torrent-tv-vietsub]
    timeout-minutes: 100
    steps:
      - name: Checkout exact owned integration source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compose pinned OMP/G1/G2/P4/P3 and run Android debug tests
        shell: powershell
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'poc\p4-auto-sub\build-p3-p4-cross-lane-on-runner.ps1') `
            -AppRepoRoot $env:GITHUB_WORKSPACE `
            -SourceCommit $env:PR_HEAD
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            throw 'FLAT_COMPOSED_ANDROID_BUILD_OR_TEST_FAIL'
          }
      - name: Build-only receipt
        if: success()
        shell: powershell
        run: |
          Write-Host 'FLAT_ANDROID_DEBUG_COMPOSED_PASS_NO_ADB_NO_TV_INSTALL_NO_PROVIDER_NO_RELEASE'
