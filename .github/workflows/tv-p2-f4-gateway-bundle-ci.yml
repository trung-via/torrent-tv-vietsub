name: Torrent TV P2-F4 offline gateway bundle source

on:
  pull_request:
    paths:
      - 'hostops/setup/p2-offline-gateway-bundle-upgrade.ps1'
      - 'poc/p2-aisub/test_p2_offline_gateway_bundle_contract.py'
      - '.github/workflows/tv-p2-f4-gateway-bundle-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source pins and parse offline PowerShell
        shell: pwsh
        run: |
          python -m unittest discover -s poc/p2-aisub -p test_p2_offline_gateway_bundle_contract.py -v
