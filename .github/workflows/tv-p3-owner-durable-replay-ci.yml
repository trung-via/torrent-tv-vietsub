name: Torrent TV - P3 Owner Durable Replay CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p2-sub-discovery/p3_owner_replay_journal.py'
      - 'poc/p2-sub-discovery/test_p3_owner_replay_journal.py'
      - 'poc/p2-sub-discovery/p3_redmi_current_state.py'
      - 'poc/p2-sub-discovery/p3_signed_playback_signal.py'
      - 'poc/p2-sub-discovery/p3_owner_state_wiring.py'
      - 'poc/p2-sub-discovery/test_p3_owner_state_wiring.py'
      - '.github/workflows/tv-p3-owner-durable-replay-ci.yml'
      - 'docs/subtitle-activation/P3_OWNER_DURABLE_REPLAY.md'
permissions:
  contents: read
jobs:
  durable-source:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-owner-durable-replay-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-redmi-current-state-owner-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed head with no persisted token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify restart-durable signed status and Play replay, corrupted DB, races
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/poc/p2-sub-discovery:$PWD/poc/p2-aisub:$PWD/poc/p3-vietsub-trigger"
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_owner_replay_journal.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_owner_state_wiring.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_redmi_current_state.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_signed*.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_p4_shared_https_route.py' -v
          python3 -m py_compile poc/p2-sub-discovery/p3_owner_replay_journal.py poc/p2-sub-discovery/p3_owner_state_wiring.py
          echo 'P3_RESTART_DURABLE_REPLAY_SOURCE_ONLY_NO_OWNER_NETWORK_NO_PROVIDER_NO_DEVICE'
