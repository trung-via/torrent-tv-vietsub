name: Torrent TV - P3 P4 Shared HTTPS Loopback CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'poc/p2-sub-discovery/p3_p4_shared_https_route.py'
      - 'poc/p2-sub-discovery/test_p3_p4_shared_https_route.py'
      - 'poc/p2-sub-discovery/p3_signed_signal_to_owner.py'
      - '.github/workflows/tv-p3-p4-shared-https-ci.yml'
      - 'docs/subtitle-activation/P3_P4_SHARED_ENDPOINT.md'

permissions:
  contents: read

jobs:
  paired-https:
    if: >-
      github.repository == 'trung-via/torrent-tv-vietsub' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'trung-via' &&
      github.event.pull_request.head.ref == 'feature/p3-p4-shared-https-route-20261114' &&
      github.event.pull_request.base.ref == 'feature/p3-signed-playback-ingress-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed PR source without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Test real TLS 1.2+ loopback, signed P3 V3 inbox, unchanged paired P4
        shell: bash
        run: |
          set -euo pipefail
          command -v openssl
          export PYTHONPATH="$PWD/poc/p2-sub-discovery:$PWD/poc/p2-aisub:$PWD/poc/p3-vietsub-trigger"
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_p4_shared_https_route.py' -v
          python3 -m unittest discover -s poc/p2-sub-discovery -p 'test_p3_signed*.py' -v
          python3 -m py_compile poc/p2-sub-discovery/p3_p4_shared_https_route.py
          echo 'P3_P4_TLS_LOOPBACK_SYNTHETIC_NO_REAL_OWNER_SERVICE_NO_PHONE_TV_NO_API'
